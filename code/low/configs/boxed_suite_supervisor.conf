[unix_http_server]
file=/share/personal/yekangjie/lab-low/code/.cache/boxed_supervisor.sock
chmod=0600

[supervisord]
nodaemon=true
logfile=/share/personal/yekangjie/lab-low/code/.cache/boxed_supervisor.log
logfile_maxbytes=10MB
logfile_backups=2
pidfile=/share/personal/yekangjie/lab-low/code/.cache/boxed_supervisor.pid
childlogdir=/share/personal/yekangjie/lab-low/code/.cache

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///share/personal/yekangjie/lab-low/code/.cache/boxed_supervisor.sock

[program:boxed-suite]
directory=/share/personal/yekangjie/lab-low/code
command=/share/personal/yekangjie/lab-low/envs/openwam/bin/python scripts/prepare_and_run_boxed_suite.py
environment=PYTHONUNBUFFERED="1",CUDA_VISIBLE_DEVICES="3"
autostart=true
autorestart=false
startsecs=10
startretries=0
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/share/personal/yekangjie/lab-low/code/.cache/boxed_queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
