[unix_http_server]
file=/share/personal/yekangjie/lab-low/code/.cache/boxed_parallel.sock
chmod=0600

[supervisord]
nodaemon=false
logfile=/share/personal/yekangjie/lab-low/code/.cache/boxed_parallel_supervisor.log
pidfile=/share/personal/yekangjie/lab-low/code/.cache/boxed_parallel_supervisor.pid
childlogdir=/share/personal/yekangjie/lab-low/code/.cache

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///share/personal/yekangjie/lab-low/code/.cache/boxed_parallel.sock

[program:boxed-take-tube]
command=/share/personal/yekangjie/lab-low/envs/openwam/bin/python scripts/run_boxed_parallel.py take_tube
directory=/share/personal/yekangjie/lab-low/code
autostart=true
autorestart=false
startsecs=10
startretries=0
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/share/personal/yekangjie/lab-low/code/.cache/boxed_take_tube_service.log

[program:boxed-dispense]
command=/share/personal/yekangjie/lab-low/envs/openwam/bin/python scripts/run_boxed_parallel.py dispense
directory=/share/personal/yekangjie/lab-low/code
autostart=true
autorestart=false
startsecs=10
startretries=0
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/share/personal/yekangjie/lab-low/code/.cache/boxed_dispense_service.log

[program:boxed-take-dropper]
command=/share/personal/yekangjie/lab-low/envs/openwam/bin/python scripts/run_boxed_parallel.py take_dropper
directory=/share/personal/yekangjie/lab-low/code
autostart=true
autorestart=false
startsecs=10
startretries=0
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/share/personal/yekangjie/lab-low/code/.cache/boxed_take_dropper_service.log
